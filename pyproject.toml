[project]
name = "electronics-catalog"
version = "0.1.0"
description = "Git-versioned electronics component catalog built with MkDocs Material"
requires-python = ">=3.10"
dependencies = [
    "mkdocs>=1.6.1",
    "mkdocs-awesome-pages-plugin>=2.10.1",
    "mkdocs-macros-plugin>=1.5.0",
    "mkdocs-material>=9.7.6",
    "pillow>=12.2.0",
    "pyyaml>=6.0.3",
    "qrcode>=8.2",
]
